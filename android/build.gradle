group 'io.mway.managed_configurations'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9+ compiles Kotlin itself unless the app opts out with android.builtInKotlin=false.
// Apply the Kotlin Gradle plugin only when that built-in support is off, so the plugin
// builds on every Flutter and AGP version, not only on Flutter 3.44+ (which applies KGP
// to plugins that lack it).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = agpMajor >= 9 &&
    project.findProperty('android.builtInKotlin')?.toString() != 'false'
if (!builtInKotlin && !plugins.hasPlugin('org.jetbrains.kotlin.android')) {
    apply plugin: 'kotlin-android'
}

android {
    if (project.android.hasProperty('namespace')) {
        namespace 'io.mway.managed_configurations'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        compileSdk 36
        minSdkVersion 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.enterprise:enterprise-feedback:1.1.0'
    implementation 'androidx.core:core:1.12.0'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
